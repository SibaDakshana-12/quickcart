<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ShopNow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="logo">ShopNow</a>
        <div class="nav-links">
            <a href="products.html">Products</a>
            <a href="admin.html" style="color:#e94560;">Admin Panel</a>
            <a href="cart.html" class="cart-icon">
                Cart
                <span id="cart-count">0</span>
            </a>
            <a href="profile.html" id="nav-profile" style="display:none">Profile</a>
            <a href="login.html" id="nav-login">Login</a>
            <a href="#" id="nav-logout" style="display:none">Logout</a>
        </div>
    </nav>

    <!-- ADMIN SECTION -->
    <section class="section">
        <h2>Admin Panel</h2>

        <!-- STATS -->
        <div class="admin-stats" id="admin-stats">
            <div class="stat-card">
                <div class="stat-number" id="total-orders">0</div>
                <div class="stat-label">Total Orders</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pending-orders">0</div>
                <div class="stat-label">Pending Orders</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="delivered-orders">0</div>
                <div class="stat-label">Delivered Orders</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-revenue">₹0</div>
                <div class="stat-label">Total Revenue</div>
            </div>
        </div>

        <!-- ORDERS TABLE -->
        <h3 style="font-size:18px; margin-bottom:16px; color:#1a1a2e;">
            All Orders
        </h3>

        <div id="orders-container">
            <div class="loading">Loading orders...</div>
        </div>

    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2024 ShopNow. All rights reserved.</p>
    </footer>

    <div class="toast" id="toast"></div>

    <script src="js/auth.js"></script>
    <script>
        const getStatusColor = (status) => {
            const colors = {
                'Order Placed':     '#3498db',
                'Being Packed':     '#f39c12',
                'Shipped':          '#9b59b6',
                'Out for Delivery': '#e67e22',
                'Delivered':        '#27ae60',
                'Cancelled':        '#e74c3c'
            };
            return colors[status] || '#888';
        };

        const loadOrders = async () => {
            const container = document.getElementById('orders-container');

            try {
                const res = await fetch(`${API}/orders`, {
                    headers: {
                        'Authorization': `Bearer ${getToken()}`
                    }
                });

                const orders = await res.json();

                if (orders.length === 0) {
                    container.innerHTML =
                        '<div class="empty">No orders yet</div>';
                    return;
                }

                document.getElementById('total-orders').textContent =
                    orders.length;
                document.getElementById('pending-orders').textContent =
                    orders.filter(o =>
                        o.orderStatus !== 'Delivered' &&
                        o.orderStatus !== 'Cancelled'
                    ).length;
                document.getElementById('delivered-orders').textContent =
                    orders.filter(o =>
                        o.orderStatus === 'Delivered'
                    ).length;
                document.getElementById('total-revenue').textContent =
                    '₹' + orders
                        .filter(o => o.orderStatus !== 'Cancelled')
                        .reduce((sum, o) => sum + o.totalPrice, 0)
                        .toLocaleString();

                container.innerHTML = `
                    <div style="overflow-x:auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Payment</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Update</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${orders.map(order => `
                            <tr>
                                <td style="font-weight:600;">
                                    #${order._id.slice(-8).toUpperCase()}
                                </td>
                                <td>
                                    <p style="font-weight:500;">
                                        ${order.user ? order.user.name : 'N/A'}
                                    </p>
                                    <p style="font-size:12px; color:#888;">
                                        ${order.user ? order.user.email : ''}
                                    </p>
                                </td>
                                <td>
                                    ${order.orderItems.map(item =>
                                        `<p style="font-size:13px;">
                                            ${item.name} × ${item.qty}
                                        </p>`
                                    ).join('')}
                                </td>
                                <td style="font-weight:700; color:#e94560;">
                                    ₹${order.totalPrice.toLocaleString()}
                                </td>
                                <td>${order.paymentMethod}</td>
                                <td>
                                    ${new Date(order.createdAt)
                                        .toLocaleDateString('en-IN')}
                                </td>
                                <td>
                                    <span class="status-badge"
                                          style="background:${getStatusColor(order.orderStatus)};">
                                        ${order.orderStatus}
                                    </span>
                                </td>
                                <td>
                                    ${order.orderStatus !== 'Delivered' &&
                                      order.orderStatus !== 'Cancelled' ? `
                                    <select class="status-select"
                                            onchange="updateStatus('${order._id}', this.value)"
                                            id="select-${order._id}">
                                        <option value="">Update Status</option>
                                        <option value="Being Packed">Being Packed</option>
                                        <option value="Shipped">Shipped</option>
                                        <option value="Out for Delivery">Out for Delivery</option>
                                        <option value="Delivered">Delivered</option>
                                    </select>` : `
                                    <span style="font-size:13px; color:#888;">
                                        No actions
                                    </span>`}
                                </td>
                            </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    </div>`;

            } catch (error) {
                container.innerHTML =
                    '<div class="empty">Failed to load orders</div>';
            }
        };

        const updateStatus = async (orderId, newStatus) => {
            if (!newStatus) return;

            try {
                const res = await fetch(`${API}/orders/${orderId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getToken()}`
                    },
                    body: JSON.stringify({ orderStatus: newStatus })
                });

                const data = await res.json();

                if (res.ok) {
                    showToast(`Order updated to: ${newStatus}`);
                    loadOrders();
                } else {
                    showToast(data.message);
                }

            } catch (error) {
                showToast('Failed to update order status');
            }
        };

        const user = getUser();
        if (!user || !user.isAdmin) {
            window.location.href = 'index.html';
        } else {
            loadOrders();
        }
    </script>
</body>
</html>
