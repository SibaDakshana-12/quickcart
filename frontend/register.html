<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - QuickCart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="logo">QuickCart</a>
        <div class="nav-links">
            <a href="products.html">Products</a>
            <a href="cart.html" class="cart-icon">
                Cart
                <span id="cart-count">0</span>
            </a>
            <a href="login.html" id="nav-login">Login</a>
            <a href="#" id="nav-logout" style="display:none">Logout</a>
            <a href="admin.html" id="nav-admin" style="display:none; color:#e94560;">Admin</a>
        </div>
    </nav>

    <!-- REGISTER FORM -->
    <div class="form-container">
        <h2>Create Account</h2>

        <div class="error-msg" id="error-msg"></div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label>Password</label>
            <div style="position:relative;">
                <input type="password" id="password"
                    placeholder="Minimum 6 characters"
                    style="padding-right:48px;">
                <button onclick="togglePassword('password', 'eye-register')"
                        type="button"
                        style="position:absolute; right:12px; top:50%;
                            transform:translateY(-50%);
                            background:none; border:none;
                            cursor:pointer; color:#888;
                            font-size:18px; padding:0;">
                    <span id="eye-register">👁️</span>
                </button>
            </div>
        </div>

        <button class="btn-submit" onclick="registerUser()">Create Account</button>

        <div class="switch-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/auth.js"></script>
    <script>
        const togglePassword = (inputId, eyeId) => {
            const input = document.getElementById(inputId);
            const eye = document.getElementById(eyeId);
            if (input.type === 'password') {
                input.type = 'text';
                eye.textContent = '🙈';
            } else {
                input.type = 'password';
                eye.textContent = '👁️';
            }
        };
        
        const registerUser = async () => {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');

            errorMsg.style.display = 'none';

            if (!name || !email || !password) {
                errorMsg.textContent = 'Please fill all fields';
                errorMsg.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errorMsg.textContent = 'Password must be at least 6 characters';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`${API}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('user', JSON.stringify(data));
                    window.location.href = 'index.html';
                } else {
                    errorMsg.textContent = data.message;
                    errorMsg.style.display = 'block';
                }

            } catch (error) {
                errorMsg.textContent = 'Something went wrong. Try again.';
                errorMsg.style.display = 'block';
            }
        };
    </script>
</body>
</html>
