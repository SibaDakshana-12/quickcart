<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - QuickCart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="logo">QuickCart</a>
        <div class="nav-links">
            <a href="products.html">Products</a>
            <a href="cart.html" class="cart-icon">
                Cart
                <span id="cart-count">0</span>
            </a>
            <a href="profile.html" id="nav-profile" style="display:none">Profile</a>
            <a href="login.html" id="nav-login">Login</a>
            <a href="#" id="nav-logout" style="display:none">Logout</a>
            <a href="admin.html" id="nav-admin" style="display:none; color:#e94560;">Admin</a>
        </div>
    </nav>

    <!-- CART SECTION -->
    <section class="section">
        <h2>Your Cart</h2>
        <div id="cart-container"></div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2024 QuickCart. All rights reserved.</p>
    </footer>

    <div class="toast" id="toast"></div>

    <script src="js/auth.js"></script>
    <script>
        const renderCart = () => {
            const container = document.getElementById('cart-container');
            const cart = JSON.parse(localStorage.getItem('cart')) || [];

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <p style="font-size:18px; margin-bottom:16px;">
                            Your cart is empty
                        </p>
                        <a href="products.html" class="btn-primary"
                           style="text-decoration:none; padding:12px 28px;
                                  border-radius:8px;">
                            Shop Now
                        </a>
                    </div>`;
                return;
            }

            const itemsPrice = cart.reduce(
                (sum, item) => sum + item.price * item.qty, 0
            );
            const shippingPrice = itemsPrice > 500 ? 0 : 50;
            const totalPrice = itemsPrice + shippingPrice;

            container.innerHTML = `
                <div style="display:grid;
                            grid-template-columns: 1fr 320px;
                            gap:24px; align-items:start;">

                    <!-- CART ITEMS -->
                    <div>
                        ${cart.map(item => `
                        <div style="background:#fff; border-radius:12px;
                                    padding:16px; margin-bottom:16px;
                                    display:flex; gap:16px;
                                    align-items:center;
                                    box-shadow:0 2px 8px rgba(0,0,0,0.06);">

                            <img src="${item.image}"
                                 alt="${item.name}"
                                 style="width:90px; height:90px;
                                        object-fit:cover; border-radius:8px;"
                                 onerror="this.src='https://via.placeholder.com/90'">

                            <div style="flex:1;">
                                <h3 style="font-size:16px; margin-bottom:4px;">
                                    ${item.name}
                                </h3>
                                <p style="color:#e94560; font-weight:700;
                                          font-size:18px; margin-bottom:8px;">
                                    ₹${item.price.toLocaleString()}
                                </p>

                                <!-- QUANTITY CONTROLS -->
                                <div style="display:flex;
                                            align-items:center; gap:8px;">
                                    <button onclick="changeQty('${item.id}', -1)"
                                        style="width:32px; height:32px;
                                               border:1.5px solid #ddd;
                                               border-radius:6px; background:#fff;
                                               font-size:18px; cursor:pointer;
                                               display:flex; align-items:center;
                                               justify-content:center;">−
                                    </button>

                                    <span style="font-size:16px;
                                                 font-weight:600;
                                                 min-width:24px;
                                                 text-align:center;">
                                        ${item.qty}
                                    </span>

                                    <button onclick="changeQty('${item.id}', 1)"
                                        style="width:32px; height:32px;
                                               border:1.5px solid #ddd;
                                               border-radius:6px; background:#fff;
                                               font-size:18px; cursor:pointer;
                                               display:flex; align-items:center;
                                               justify-content:center;">+
                                    </button>

                                    <button onclick="removeItem('${item.id}')"
                                        style="margin-left:8px; padding:6px 12px;
                                               background:#ffe0e0; color:#c0392b;
                                               border:none; border-radius:6px;
                                               cursor:pointer; font-size:13px;">
                                        Remove
                                    </button>
                                </div>
                            </div>

                            <!-- ITEM TOTAL -->
                            <div style="text-align:right;">
                                <p style="font-size:16px; font-weight:700;
                                          color:#1a1a2e;">
                                    ₹${(item.price * item.qty).toLocaleString()}
                                </p>
                            </div>
                        </div>
                        `).join('')}
                    </div>

                    <!-- ORDER SUMMARY -->
                    <div style="background:#fff; border-radius:12px;
                                padding:24px;
                                box-shadow:0 2px 8px rgba(0,0,0,0.06);
                                position:sticky; top:80px;">
                        <h3 style="font-size:20px; margin-bottom:20px;
                                   color:#1a1a2e;">
                            Order Summary
                        </h3>

                        <div style="display:flex; justify-content:space-between;
                                    margin-bottom:12px; font-size:15px;">
                            <span style="color:#666;">Items Price</span>
                            <span>₹${itemsPrice.toLocaleString()}</span>
                        </div>

                        <div style="display:flex; justify-content:space-between;
                                    margin-bottom:12px; font-size:15px;">
                            <span style="color:#666;">Shipping</span>
                            <span style="color:${shippingPrice === 0 ?
                                '#27ae60' : '#333'};">
                                ${shippingPrice === 0 ?
                                    'FREE' :
                                    '₹' + shippingPrice}
                            </span>
                        </div>

                        ${shippingPrice > 0 ? `
                        <p style="font-size:12px; color:#888;
                                  margin-bottom:12px;">
                            Add items worth
                            ₹${(500 - itemsPrice).toLocaleString()}
                            more for free shipping
                        </p>` : ''}

                        <div style="border-top:1.5px solid #eee;
                                    padding-top:12px; margin-bottom:20px;
                                    display:flex; justify-content:space-between;
                                    font-size:18px; font-weight:700;">
                            <span>Total</span>
                            <span style="color:#e94560;">
                                ₹${totalPrice.toLocaleString()}
                            </span>
                        </div>

                        <button onclick="proceedToCheckout()"
                            style="width:100%; padding:14px;
                                   background:#e94560; color:#fff;
                                   border:none; border-radius:8px;
                                   font-size:16px; font-weight:600;
                                   cursor:pointer; transition:background 0.2s;"
                            onmouseover="this.style.background='#c73652'"
                            onmouseout="this.style.background='#e94560'">
                            Proceed to Checkout
                        </button>

                        <a href="products.html"
                           style="display:block; text-align:center;
                                  margin-top:12px; color:#888;
                                  text-decoration:none; font-size:14px;">
                            ← Continue Shopping
                        </a>
                    </div>
                </div>`;
        };

        const changeQty = (id, change) => {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const item = cart.find(item => item.id === id);

            if (item) {
                item.qty += change;
                if (item.qty <= 0) {
                    cart = cart.filter(item => item.id !== id);
                }
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            renderCart();
        };

        const removeItem = (id) => {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart = cart.filter(item => item.id !== id);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            renderCart();
            showToast('Item removed from cart');
        };

        const proceedToCheckout = () => {
            const user = getUser();
            if (!user) {
                showToast('Please login to checkout');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
                return;
            }
            window.location.href = 'checkout.html';
        };

        renderCart();
    </script>
</body>
</html>
